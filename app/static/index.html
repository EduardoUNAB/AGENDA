<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AGENDA</title>
</head>
<body>
  <main>
    <h1>AGENDA</h1>
    <form id="persona-form">
      <label>Nombre <input name="nombre" required></label>
      <label>Apellidos <input name="apellidos" required></label>
      <label>Fecha de nacimiento <input name="fecha_nacimiento" type="date"></label>
      <label>Correo <input name="correo" type="email"></label>
      <label>Telefono <input name="telefono"></label>
      <label>Direccion <input name="direccion"></label>
      <label>Categoria
        <select name="categoria">
          <option value="">Seleccionar</option>
          <option value="familia">familia</option>
          <option value="trabajo">trabajo</option>
          <option value="amigos">amigos</option>
          <option value="otros">otros</option>
        </select>
      </label>
      <label>Comentarios <textarea name="comentarios"></textarea></label>
      <div id="form-errors" role="alert"></div>
      <button type="submit">Guardar</button>
    </form>

    <section aria-labelledby="list-title">
      <h2 id="list-title">Personas</h2>
      <div id="list-status" role="status"></div>
      <table id="personas-table" hidden>
        <thead><tr><th>ID</th><th>Nombre</th><th>Apellidos</th><th>Telefono</th></tr></thead>
        <tbody></tbody>
      </table>
    </section>
  </main>
  <script>
    const form = document.querySelector('#persona-form');
    const errors = document.querySelector('#form-errors');
    const status = document.querySelector('#list-status');
    const table = document.querySelector('#personas-table');
    const body = table.querySelector('tbody');

    function showFormErrors(detail) {
      errors.textContent = Object.values(detail || {}).join(' ');
    }

    async function loadPersonas() {
      status.textContent = 'Cargando...';
      table.hidden = true;
      try {
        const response = await fetch('/api/personas');
        if (!response.ok) throw new Error('No se pudo cargar la agenda.');
        const personas = await response.json();
        body.replaceChildren();
        if (personas.length === 0) {
          status.textContent = 'La agenda esta vacia';
          return;
        }
        personas.forEach((persona) => {
          const row = document.createElement('tr');
          [persona.id, persona.nombre, persona.apellidos, persona.telefono].forEach((value) => {
            const cell = document.createElement('td');
            cell.textContent = value;
            row.appendChild(cell);
          });
          body.appendChild(row);
        });
        status.textContent = '';
        table.hidden = false;
      } catch (error) {
        status.textContent = error.message;
        const retry = document.createElement('button');
        retry.type = 'button';
        retry.textContent = 'Reintentar';
        retry.addEventListener('click', loadPersonas, { once: true });
        status.appendChild(retry);
      }
    }

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      errors.textContent = '';
      const data = Object.fromEntries(new FormData(form));
      const response = await fetch('/api/personas', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(data)
      });
      if (!response.ok) {
        const result = await response.json();
        showFormErrors(result.detail);
        return;
      }
      form.reset();
      await loadPersonas();
    });

    loadPersonas();
  </script>
</body>
</html>
